# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Only build the resources needed for the configuration being built.
android.nonTransitiveRClass=true

# The version series every build and every release tag is named for: an APK is
# <series>.<run number>, a production tag is v<series>.<n> and a dev tag adds
# -dev. It lives here rather than in the build file because the workflows have
# to name the tag as well, and they read it straight out of this file — three
# copies of "1.2" would be three chances for a release to be tagged one thing
# and built as another.
#
# Only the series is set by hand. The number after it is the CI run number, so
# it keeps climbing on its own and an APK's versionCode never goes backwards
# when this changes.
plgVersionSeries=1.2
